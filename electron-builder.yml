appId: com.homita.app
productName: Homita
directories:
  output: dist
  buildResources: build
files:
  - electron/**/*
  - server/**/*
  - web/**/*
  - node_modules/**/*
  - package.json
  - "!web/pages*.js.map"
  - "!data/**"
  - "!dist/**"
  - "!**/*.log"
asar: true
compression: normal
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
  artifactName: Homita-Portable-${version}.exe
